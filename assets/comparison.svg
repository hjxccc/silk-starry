<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0820"/><stop offset="0.55" stop-color="#1d1248"/><stop offset="1" stop-color="#3a1d72"/></linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a7bff"/><stop offset="0.5" stop-color="#c4a3ff"/><stop offset="1" stop-color="#86c8ff"/></linearGradient>
  </defs>
  <rect width="760" height="360" rx="16" fill="url(#bg)"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="url(#silk)">同一个真实项目，CLAUDE.md 写多少行？</text>
  <text x="380" y="52" text-anchor="middle" font-size="12.5" fill="#a9b0e0">经验值：根文件 ≤200 行、理想 &lt;60；越短 AI 越照做（指令越多遵守率越低）</text>

  <line x1="70" y1="290" x2="710" y2="290" stroke="#ffffff" stroke-opacity="0.22"/>
  <g font-size="11" fill="#8a90c0" text-anchor="end">
    <line x1="70" y1="232" x2="710" y2="232" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="236">40</text>
    <line x1="70" y1="174" x2="710" y2="174" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="178">80</text>
    <line x1="70" y1="116" x2="710" y2="116" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="120">120</text>
  </g>
  <!-- 理想区 ≤60 行 -->
  <rect x="70" y="203" width="640" height="87" fill="#6ee7a0" fill-opacity="0.10"/>
  <line x1="70" y1="203" x2="710" y2="203" stroke="#6ee7a0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="78" y="198" font-size="11" font-weight="700" fill="#7fe0a8">↓ 理想区（≤60 行）—— 只有 silk-starry 的三根落在这里</text>

  <!-- requests -->
  <g>
    <rect x="120" y="249" width="50" height="41" rx="4" fill="#9a7bff"/><text x="145" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#c4a3ff">28</text>
    <rect x="178" y="120" width="50" height="170" rx="4" fill="#5b6080"/><text x="203" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#9aa0c0">117</text>
    <text x="174" y="310" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cdd2f5">requests (Py)</text>
  </g>
  <!-- gin -->
  <g>
    <rect x="300" y="246" width="50" height="44" rx="4" fill="#9a7bff"/><text x="325" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#c4a3ff">30</text>
    <rect x="358" y="152" width="50" height="138" rx="4" fill="#5b6080"/><text x="383" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#9aa0c0">95</text>
    <text x="354" y="310" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cdd2f5">gin (Go)</text>
  </g>
  <!-- humanlayer -->
  <g>
    <rect x="476" y="229" width="42" height="61" rx="4" fill="#9a7bff"/><text x="497" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#c4a3ff">42</text>
    <rect x="524" y="162" width="42" height="128" rx="4" fill="#e0a92e"/><text x="545" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#f0c674">88</text>
    <rect x="572" y="106" width="42" height="184" rx="4" fill="#5b6080"/><text x="593" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#9aa0c0">127</text>
    <text x="545" y="310" text-anchor="middle" font-size="12.5" font-weight="600" fill="#cdd2f5">humanlayer (TS+Go)</text>
  </g>

  <g font-size="12" font-weight="600">
    <rect x="240" y="332" width="13" height="13" rx="3" fill="#9a7bff"/><text x="258" y="343" fill="#cdd2f5">silk-starry</text>
    <rect x="350" y="332" width="13" height="13" rx="3" fill="#e0a92e"/><text x="368" y="343" fill="#cdd2f5">专家手写</text>
    <rect x="436" y="332" width="13" height="13" rx="3" fill="#5b6080"/><text x="454" y="343" fill="#cdd2f5">Claude 自带 /init</text>
  </g>
</svg>
