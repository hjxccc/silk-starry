<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0820"/><stop offset="0.55" stop-color="#1a1142"/><stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7bff"/><stop offset="0.5" stop-color="#c4a3ff"/><stop offset="1" stop-color="#86c8ff"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" rx="16" fill="url(#bg)"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="url(#silk)">Claude Code 记忆机制全景 × silk 在哪一层发力</text>
  <text x="450" y="53" text-anchor="middle" font-size="11.5" fill="#7a80b0">据 Claude Code 源码（getMemoryFiles / SessionMemory / autoDream / MemoryType / isAutoMemPath / findRelevantMemories）</text>

  <text x="60"  y="80" font-size="12.5" font-weight="700" fill="#a9b0e0">记忆层</text>
  <text x="340" y="80" font-size="12.5" font-weight="700" fill="#a9b0e0">谁写 · 怎么加载 · 多大</text>
  <text x="610" y="80" font-size="12.5" font-weight="700" fill="#c4a3ff">silk 在这层做什么</text>
  <line x1="48" y1="88" x2="852" y2="88" stroke="#ffffff" stroke-opacity="0.14"/>

  <!-- 1 Transcripts -->
  <rect x="48" y="98" width="270" height="60" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="62" y="123" font-size="14" font-weight="800" fill="#c2c8e8">① 对话历史 Transcripts</text>
  <text x="62" y="143" font-size="11" fill="#7a80b0">完整对话 JSONL · /export</text>
  <text x="340" y="123" font-size="11.5" fill="#aab0d8">系统写 · ❌ 不自动加载(grep 查) · MB–GB</text>
  <text x="610" y="130" font-size="12" fill="#dfe3f7">🧹 <tspan font-weight="700" fill="#c4a3ff">disk_hygiene</tspan> 体检膨胀(真凶常在这)</text>

  <!-- 2 Session Memory -->
  <rect x="48" y="170" width="270" height="60" rx="9" fill="#6f86e0" fill-opacity="0.10" stroke="#7b8fd6" stroke-opacity="0.6"/>
  <text x="62" y="195" font-size="14" font-weight="800" fill="#9fb0f0">② 会话记忆 Session Memory</text>
  <text x="62" y="215" font-size="11" fill="#8088b8">后台代理实时摘要 · 压缩用</text>
  <text x="340" y="195" font-size="11.5" fill="#aab0d8">后台代理写 · ✅ 相关时加载 · 10–100KB</text>
  <text x="610" y="202" font-size="12" fill="#8088b8">了解即可，silk 不干预</text>

  <!-- 3 CLAUDE.md 核心 -->
  <rect x="48" y="242" width="270" height="60" rx="9" fill="#9a7bff" fill-opacity="0.16" stroke="#b69cff" stroke-width="2"/>
  <text x="62" y="267" font-size="14" font-weight="800" fill="#c4a3ff">③ CLAUDE.md（4 层）★核心</text>
  <text x="62" y="287" font-size="11" fill="#a99fd0">全局/项目/local/子目录 · 行为契约</text>
  <text x="340" y="267" font-size="11.5" fill="#aab0d8">你写 · ✅ 每次注入 · ≤200 行(理想≤60)</text>
  <text x="610" y="274" font-size="12" fill="#ece8ff">📝 <tspan font-weight="700" fill="#c4a3ff">generate / audit / evolve / locate</tspan></text>
  <text x="610" y="291" font-size="11" fill="#8a90c0">写好·体检·进化·就近定位(silk 主战场)</text>

  <!-- 4 Auto Memory -->
  <rect x="48" y="314" width="270" height="60" rx="9" fill="#6ee7a0" fill-opacity="0.10" stroke="#6ee7a0" stroke-width="2" stroke-opacity="0.7"/>
  <text x="62" y="339" font-size="14" font-weight="800" fill="#7fe0a8">④ Auto Memory（自动记忆）</text>
  <text x="62" y="359" font-size="11" fill="#6cb88a">MEMORY.md 索引 + topic · 4 类型</text>
  <text x="340" y="339" font-size="11.5" fill="#aab0d8">Claude 自动写 · ✅ 索引每次 · ~25KB</text>
  <text x="610" y="346" font-size="12" fill="#ece8ff">🩺 <tspan font-weight="700" fill="#7fe0a8">memory_digest / memory_doctor / graduate</tspan></text>
  <text x="610" y="363" font-size="11" fill="#8a90c0">挖候选·体检·升级进 CLAUDE.md 后清理</text>

  <!-- 5 Team Memory -->
  <rect x="48" y="386" width="270" height="48" rx="9" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="62" y="409" font-size="14" font-weight="800" fill="#c2c8e8">⑤ 团队记忆 Team Memory</text>
  <text x="62" y="426" font-size="11" fill="#7a80b0">团队共享层</text>
  <text x="340" y="414" font-size="11.5" fill="#aab0d8">团队写 · ✅ · —</text>
  <text x="610" y="414" font-size="12" fill="#8088b8">了解即可</text>

  <!-- 召回机制 -->
  <rect x="48" y="446" width="804" height="40" rx="8" fill="#e0a92e" fill-opacity="0.10" stroke="#e0a92e" stroke-opacity="0.4"/>
  <text x="62" y="463" font-size="12" font-weight="700" fill="#f0c674">召回机制（源码 findRelevantMemories）</text>
  <text x="62" y="479" font-size="11" fill="#d6c79a">MEMORY.md 索引常驻；单条记忆由 Sonnet 读"文件头清单(按 description 选)"挑最相关 5 条注入；&gt;1 天的记忆带"47 天前…可能过时"警告 → 所以 silk 盯紧 description 与时效。</text>

  <!-- 控制层 -->
  <text x="60" y="512" font-size="12.5" font-weight="700" fill="#a9b0e0">控制层（决定上面怎么加载/强制）</text>
  <g font-size="11.5">
    <rect x="48"  y="522" width="190" height="54" rx="8" fill="#9a7bff" fill-opacity="0.10" stroke="#b69cff" stroke-opacity="0.6"/>
    <text x="60" y="544" font-weight="700" fill="#c4a3ff">.claude/rules/（paths 懒加载）</text>
    <text x="60" y="563" fill="#8a90c0">silk：audit 拆分 + introspect 预测触发</text>
    <rect x="248" y="522" width="190" height="54" rx="8" fill="#ff7a6b" fill-opacity="0.10" stroke="#ff7a6b" stroke-opacity="0.5"/>
    <text x="260" y="544" font-weight="700" fill="#ff9b8f">settings.json（强制）</text>
    <text x="260" y="563" fill="#8a90c0">silk：硬约束转 hook + 记忆开关体检</text>
    <rect x="448" y="522" width="190" height="54" rx="8" fill="#6f86e0" fill-opacity="0.10" stroke="#7b8fd6" stroke-opacity="0.6"/>
    <text x="460" y="544" font-weight="700" fill="#9fb0f0">hooks（自动化）</text>
    <text x="460" y="563" fill="#8a90c0">silk：install_hooks 装提醒/嗅探</text>
    <rect x="648" y="522" width="204" height="54" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="660" y="544" font-weight="700" fill="#c2c8e8">磁盘 debug//file-history/</text>
    <text x="660" y="563" fill="#8a90c0">silk：disk_hygiene 揪膨胀(可达 300GB)</text>
  </g>
</svg>
